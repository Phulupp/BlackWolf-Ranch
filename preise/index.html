<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Aktuelle Preise von Hornhausen-Hof - öffentlich einsehbar, ohne Login." />
  <title>Preisliste — Hornhausen-Hof</title>

  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" href="../assets/logo/favicon-mais.png?v=90" />
  <link rel="apple-touch-icon" href="../assets/logo/favicon-mais.png?v=90" />

  <!-- Google Fonts: dieselben wie auf der Hauptseite (Rye/Playfair Display/Vollkorn) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Rye&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Vollkorn:ital,wght@0,400;0,600;0,700;1,400&display=swap"
    rel="stylesheet"
  />

  <!-- Bewusst NUR Grundtypografie (tokens.css für Schriftarten) + reset.css +
       diese eigene, komplett unabhängige preise.css - keine der Stylesheets
       der Hauptseite. Wand und Brett nutzen beide dasselbe Holz-Foto
       (unterschiedlich aufgehellt/gemischt), Rahmen/Nägel/Messingdetails
       und die dunkle "Tinten"-Schrift auf dem hellen Brett sind reines CSS
       (siehe Kommentar oben in preise.css). -->

  <link rel="stylesheet" href="../css/base/tokens.css?v=90" />
  <link rel="stylesheet" href="../css/base/reset.css?v=90" />
  <link rel="stylesheet" href="preise.css?v=90" />
</head>
<body>
  <div class="hofwand">
    <main class="hofwand__inhalt">
      <header class="hofwand__marke">
        <svg class="hofwand__kuh" viewBox="0 0 100 70" role="img" aria-label="Kuh-Kritzelei">
          <rect x="40" y="52" width="6" height="16" rx="2.5" fill="#e7d7bc" stroke="#140c08" stroke-width="2.2" />
          <rect x="56" y="52" width="6" height="16" rx="2.5" fill="#e7d7bc" stroke="#140c08" stroke-width="2.2" />
          <rect x="68" y="52" width="6" height="16" rx="2.5" fill="#e7d7bc" stroke="#140c08" stroke-width="2.2" />
          <rect x="80" y="52" width="6" height="16" rx="2.5" fill="#e7d7bc" stroke="#140c08" stroke-width="2.2" />
          <rect x="40" y="63" width="6" height="4" rx="1.4" fill="#a96835" />
          <rect x="56" y="63" width="6" height="4" rx="1.4" fill="#a96835" />
          <rect x="68" y="63" width="6" height="4" rx="1.4" fill="#a96835" />
          <rect x="80" y="63" width="6" height="4" rx="1.4" fill="#a96835" />
          <path d="M86,28 C96,24 100,34 96,44 C94,50 98,54 94,58" fill="none" stroke="#140c08" stroke-width="2.4" stroke-linecap="round" />
          <ellipse cx="94" cy="60" rx="4" ry="6" transform="rotate(20 94 60)" fill="#e7d7bc" stroke="#140c08" stroke-width="2.2" />
          <rect x="34" y="24" width="54" height="30" rx="15" fill="#e7d7bc" stroke="#140c08" stroke-width="2.6" />
          <ellipse cx="20" cy="16" rx="7" ry="4" transform="rotate(-25 20 16)" fill="#e7d7bc" stroke="#140c08" stroke-width="2.2" />
          <ellipse cx="34" cy="14" rx="7" ry="4" transform="rotate(20 34 14)" fill="#e7d7bc" stroke="#140c08" stroke-width="2.2" />
          <circle cx="26" cy="26" r="15" fill="#e7d7bc" stroke="#140c08" stroke-width="2.6" />
          <ellipse cx="15" cy="32" rx="9" ry="7" fill="#e7d7bc" stroke="#140c08" stroke-width="2.2" />
          <path d="M50,30 C56,26 64,28 62,36 C60,42 50,42 48,36 C46,32 46,32 50,30 Z" fill="#140c08" />
          <path d="M74,34 C80,32 84,38 80,44 C76,48 70,44 72,38 Z" fill="#140c08" />
          <path d="M18,10 C16,4 12,2 8,4" fill="none" stroke="#a96835" stroke-width="2.6" stroke-linecap="round" />
          <path d="M32,8 C34,2 38,1 42,3" fill="none" stroke="#a96835" stroke-width="2.6" stroke-linecap="round" />
          <circle cx="22" cy="23" r="2" fill="#140c08" />
          <circle cx="22.6" cy="22.3" r="0.7" fill="#a96835" />
        </svg>
        <span class="hofwand__markentitel">Hornhausen-Hof</span>
        <span class="hofwand__markenzusatz">Est. 1899</span>
      </header>

      <div class="preistafel">
        <div class="preistafel__rahmen">
          <span class="preistafel__nagel preistafel__nagel--tl" aria-hidden="true"></span>
          <span class="preistafel__nagel preistafel__nagel--tr" aria-hidden="true"></span>
          <span class="preistafel__nagel preistafel__nagel--bl" aria-hidden="true"></span>
          <span class="preistafel__nagel preistafel__nagel--br" aria-hidden="true"></span>

          <div class="preistafel__flaeche">
            <h1 class="preistafel__titel">Unsere Preise</h1>

            <div id="preise-liste" class="preistafel__inhalt"></div>
            <p class="preistafel__status" id="preise-laden">Preise werden geladen …</p>
            <p class="preistafel__status" id="preise-leer" hidden>Aktuell sind keine Preise öffentlich hinterlegt.</p>
            <p class="preistafel__status" id="preise-fehler" hidden>
              Preise konnten nicht geladen werden. Bitte versuch es später erneut.
            </p>
          </div>
        </div>
      </div>

      <p class="hofwand__fuss">Fragen? Meldet euch einfach direkt bei uns auf dem Hof.</p>
    </main>
  </div>

  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script defer src="../js/firebase-config.js?v=90"></script>
  <script defer src="preise.js?v=90"></script>
</body>
</html>
